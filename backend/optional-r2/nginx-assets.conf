# ============================================================================
# Alternatif VPS: nginx menyajikan 1,34 GB asset game langsung.
#
# Pakai ini HANYA kalau kamu memilih VPS sendiri, bukan Cloudflare R2.
# Kalau pakai R2, lewati file ini — R2 sudah menangani Range + caching sendiri.
#
# Syarat mutlak yang harus dipenuhi server mana pun:
#   1. accept-ranges: bytes      → resume download (nginx static: otomatis)
#   2. HTTP 206 untuk Range      → nginx static: otomatis
#   3. HTTPS                     → Android 9+ blok cleartext
#   4. tidak ada batas ukuran body/response
# ============================================================================

# /etc/nginx/conf.d/sanzz-assets.conf

# Wajib: kalau tidak, nginx menolak Range pada file besar / koneksi lambat
sendfile           on;
tcp_nopush         on;
tcp_nodelay        on;

# File >4 MB melewati page cache — hindari memori habis saat 295 file besar
# dibaca berulang oleh banyak user sekaligus.
directio           4m;
output_buffers     2 1m;

# Baca file besar di thread pool, jangan blok worker event loop.
# Butuh --with-threads saat kompilasi (paket resmi nginx sudah include).
aio                threads;

open_file_cache          max=1000 inactive=60s;
open_file_cache_valid    120s;
open_file_cache_min_uses 2;

server {
    listen 443 ssl http2;
    server_name cdn.client-mu.example;

    ssl_certificate     /etc/letsencrypt/live/cdn.client-mu.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.client-mu.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ------------------------------------------------------------------
    # ASSET GAME  (≈1,34 GB, 295 file)
    # ------------------------------------------------------------------
    location /game-files/ {
        alias /var/www/game-files/;

        # Kalau kamu pakai versioning path (BACKEND-KEBUTUHAN.md §5),
        # immutable + 1 tahun aman karena path berubah tiap versi:
        #   /game-files/1.0.0/texdb/gta3.img
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Kalau path TIDAK berversi (file ditimpa di tempat), pakai ini:
        # add_header Cache-Control "public, max-age=86400" always;

        add_header Accept-Ranges bytes always;
        add_header X-Served-By   "sanzz-vps" always;

        # Jangan log tiap request asset — 295 request per install bikin log meledak
        access_log off;

        # Batasi kecepatan per koneksi HANYA kalau bandwidth VPS-mu sempit.
        # Jangan diaktifkan kalau sudah di belakang CDN.
        # limit_rate_after 10m;
        # limit_rate       2m;
    }

    # ------------------------------------------------------------------
    # MANIFEST + CONFIG  (harus cepat terlihat saat di-update)
    # ------------------------------------------------------------------
    location = /api/game-files {
        alias /var/www/manifest.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=60" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /api/update {
        alias /var/www/update.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=60" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /api/changelog {
        alias /var/www/changelog.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
    }

    # ------------------------------------------------------------------
    # APK launcher (39-70 MB) — juga butuh Range biar bisa resume
    # ------------------------------------------------------------------
    location /apk/ {
        alias /var/www/apk/;
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Accept-Ranges bytes always;
    }

    # ------------------------------------------------------------------
    # Rate limit ringan HANYA untuk endpoint JSON.
    # Jangan pasang di /game-files/ — sudah di-cache edge dan butuh bebas.
    # ------------------------------------------------------------------
    location ~ ^/api/(update|game-files|changelog)$ {
        limit_req zone=jsonapi burst=30 nodelay;
        try_files $uri =404;
    }

    location = /health {
        default_type application/json;
        return 200 '{"ok":true}';
    }
}

# di blok http { } (mis. /etc/nginx/nginx.conf):
#   limit_req_zone $binary_remote_addr zone=jsonapi:10m rate=60r/m;

# ------------------------------------------------------------------
# Kalau VPS ada DI BELAKANG Cloudflare proxy (awan oranye), tambahkan
# supaya IP asli client terbaca dan rate limit tidak salah sasaran:
#
#   set_real_ip_from 173.245.48.0/20;
#   set_real_ip_from 103.21.244.0/22;
#   ... (daftar lengkap: https://www.cloudflare.com/ips/)
#   real_ip_header CF-Connecting-IP;
#
# PERHATIAN: Cloudflare Free plan secara ToS tidak dimaksudkan untuk
# menyajikan konten mayoritas non-HTML. Menyodorkan 134 TB/bulan asset
# game lewat proxy gratis = risiko akun ditangguhkan. Itu sebabnya
# BACKEND-KEBUTUHAN.md merekomendasikan R2 (egress gratis, tanpa zona abu-abu)
# atau CDN berbayar yang memang untuk itu.
# ------------------------------------------------------------------
